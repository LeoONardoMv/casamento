<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentes Confirmados - Léo & Val</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgJg0BjjjQWAlJ1rqWenjzB-aKxeX77B4",
            authDomain: "casamento-26afe.firebaseapp.com",
            projectId: "casamento-26afe",
            storageBucket: "casamento-26afe.firebasestorage.app",
            messagingSenderId: "156199249236",
            appId: "1:156199249236:web:f7b8259810a60fbe58d4c1",
            measurementId: "G-2Q4PF5TDCD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'halloween': {
                            900: '#1a0a2e',
                            800: '#2d1b4e',
                            700: '#3d2b5e',
                            600: '#f97316',
                            500: '#fb923c',
                            400: '#fdba74',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-live {
            animation: pulse-live 2s infinite;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen font-sans text-white">
    <!-- Header -->
    <header class="text-center py-10 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="text-5xl mb-4">🎁✨</div>
            <h1 class="font-serif text-3xl md:text-5xl font-bold mb-4 text-halloween-500">
                Presentes Confirmados
            </h1>
            <p class="text-gray-300 text-lg">Léo & Val - 14/02/2026</p>
            <div class="mt-4 flex items-center justify-center gap-2">
                <span class="w-3 h-3 bg-green-400 rounded-full pulse-live"></span>
                <span class="text-green-400 text-sm">Atualizando em tempo real</span>
            </div>
        </div>
    </header>

    <!-- Estatísticas -->
    <section class="max-w-4xl mx-auto px-4 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-halloween-800/60 rounded-xl p-6 text-center border border-halloween-600/20">
                <div class="text-3xl mb-2">🎁</div>
                <p class="text-gray-400 text-sm">Total Confirmados</p>
                <p id="total-confirmados" class="text-3xl font-bold text-halloween-400">0</p>
            </div>
            <div class="bg-halloween-800/60 rounded-xl p-6 text-center border border-halloween-600/20">
                <div class="text-3xl mb-2">📦</div>
                <p class="text-gray-400 text-sm">Presentes Físicos</p>
                <p id="total-fisico" class="text-3xl font-bold text-blue-400">0</p>
            </div>
            <div class="bg-halloween-800/60 rounded-xl p-6 text-center border border-halloween-600/20">
                <div class="text-3xl mb-2">💰</div>
                <p class="text-gray-400 text-sm">Via PIX</p>
                <p id="total-pix" class="text-3xl font-bold text-green-400">0</p>
            </div>
        </div>
    </section>

    <!-- Botão voltar -->
    <div class="max-w-4xl mx-auto px-4 mb-6">
        <a href="index.html" class="inline-flex items-center gap-2 text-halloween-400 hover:text-halloween-500 transition-all">
            <i class="fas fa-arrow-left"></i>
            Voltar para Lista de Presentes
        </a>
    </div>

    <!-- Lista -->
    <main class="max-w-4xl mx-auto px-4 pb-16">
        <div id="lista-confirmados" class="space-y-3">
            <div class="text-center py-12 text-gray-500">
                <div class="text-4xl mb-4">🎃</div>
                <p>Carregando presentes confirmados...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-gray-500 text-sm">
        <p>Com muito amor 💕 Léo & Val - 2026</p>
    </footer>

    <script>
        function formatarData(data) {
            if (!data) return 'Agora mesmo';
            const d = data.toDate ? data.toDate() : new Date(data);
            return d.toLocaleString('pt-BR', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderConfirmados(docs) {
            const lista = document.getElementById('lista-confirmados');
            
            let fisico = 0;
            let pix = 0;

            if (docs.length === 0) {
                lista.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <div class="text-4xl mb-4">🎁</div>
                        <p>Nenhum presente confirmado ainda.</p>
                        <p class="text-sm mt-2">Seja o primeiro a presentear!</p>
                    </div>
                `;
                document.getElementById('total-confirmados').textContent = '0';
                document.getElementById('total-fisico').textContent = '0';
                document.getElementById('total-pix').textContent = '0';
                return;
            }

            const ordenados = [...docs].sort((a, b) => {
                const tA = a.data?.toDate ? a.data.toDate().getTime() : 0;
                const tB = b.data?.toDate ? b.data.toDate().getTime() : 0;
                return tB - tA;
            });

            lista.innerHTML = ordenados.map((doc, index) => {
                const d = doc.data || {};
                if (d.tipo === 'fisico') fisico++;
                if (d.tipo === 'pix') pix++;
                
                const icone = d.tipo === 'pix' ? '💰' : '📦';
                const cor = d.tipo === 'pix' ? 'text-green-400' : 'text-blue-400';
                const tipoLabel = d.tipo === 'pix' ? 'PIX' : 'Presente Físico';
                
                return `
                    <div class="bg-halloween-800/60 rounded-xl p-5 border border-halloween-600/20 flex items-center justify-between fade-in" style="animation-delay: ${index * 0.05}s">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl">${icone}</div>
                            <div>
                                <p class="font-semibold text-white">${d.nome || 'Anônimo'}</p>
                                <p class="text-gray-400 text-sm">${d.presente || 'Presente'}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="${cor} text-xs font-medium bg-white/5 px-3 py-1 rounded-full">${tipoLabel}</span>
                            <p class="text-gray-500 text-xs mt-1">${formatarData(d.data)}</p>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-confirmados').textContent = docs.length;
            document.getElementById('total-fisico').textContent = fisico;
            document.getElementById('total-pix').textContent = pix;
        }

        // Escutar mudanças em tempo real
        const q = window.query(window.collection(window.db, 'confirmados'), window.orderBy('data', 'desc'));
        window.onSnapshot(q, (snapshot) => {
            const docs = [];
            snapshot.forEach(doc => docs.push(doc.data()));
            renderConfirmados(docs);
        }, (error) => {
            console.error('Erro:', error);
            document.getElementById('lista-confirmados').innerHTML = `
                <div class="text-center py-12 text-red-400">
                    <div class="text-4xl mb-4">⚠️</div>
                    <p>Erro ao carregar dados.</p>
                    <p class="text-sm mt-2">Verifique se o Firestore está configurado corretamente.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
