<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentes Confirmados - Leo & Val</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgJg0BjjjQWAlJ1rqWenjzB-aKxeX77B4",
            authDomain: "casamento-26afe.firebaseapp.com",
            projectId: "casamento-26afe",
            storageBucket: "casamento-26afe.firebasestorage.app",
            messagingSenderId: "156199249236",
            appId: "1:156199249236:web:f7b8259810a60fbe58d4c1",
            measurementId: "G-2Q4PF5TDCD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
    </script>
    <style>
        :root {
            --primary: #c9a86c;
            --primary-dark: #a8894d;
            --secondary: #f8f4ef;
            --text: #3d3d3d;
            --text-light: #777;
            --white: #ffffff;
            --border: #e8e0d4;
            --green: #4a8b6f;
            --green-light: #e8f5ee;
            --blue: #5b8ec4;
            --blue-light: #e8f0fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background-color: var(--secondary);
            line-height: 1.6;
        }

        .hero {
            background: linear-gradient(135deg, #faf6f1 0%, #f0e6d6 100%);
            text-align: center;
            padding: 60px 20px 50px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: var(--primary);
            opacity: 0.1;
            border-radius: 50%;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-light);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            background: var(--green-light);
            color: var(--green);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .pulse-live {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse-live 2s infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .stats-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 16px;
            padding: 22px 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        .stat-card .icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        .stat-card.total .value { color: var(--primary-dark); }
        .stat-card.fisico .value { color: var(--blue); }
        .stat-card.pix .value { color: var(--green); }

        .back-link {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }

        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--primary);
        }

        .list-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px 60px;
        }

        .confirmado-card {
            background: var(--white);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: transform 0.2s;
        }

        .confirmado-card:hover {
            transform: translateX(5px);
        }

        .confirmado-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .confirmado-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .confirmado-icon.fisico {
            background: var(--blue-light);
        }

        .confirmado-icon.pix {
            background: var(--green-light);
        }

        .confirmado-text .nome {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        .confirmado-text .presente {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .confirmado-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .confirmado-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 4px;
        }

        .confirmado-tag.fisico {
            background: var(--blue-light);
            color: var(--blue);
        }

        .confirmado-tag.pix {
            background: var(--green-light);
            color: var(--green);
        }

        .confirmado-data {
            font-size: 0.75rem;
            color: #aaa;
        }

        .confirmado-msg {
            font-size: 0.8rem;
            color: var(--text-light);
            font-style: italic;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            width: 100%;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #c0392b;
        }

        footer {
            background: var(--text);
            color: var(--white);
            text-align: center;
            padding: 25px 20px;
        }

        footer p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        footer .heart-footer {
            color: var(--primary);
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .confirmado-card { flex-direction: column; align-items: flex-start; }
            .confirmado-meta { text-align: left; width: 100%; margin-top: 8px; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">🎁✨</div>
        <h1>Presentes Confirmados</h1>
        <p>Leo & Val — 31 de Outubro de 2026</p>
        <div class="live-badge">
            <span class="pulse-live"></span>
            Atualizando em tempo real
        </div>
    </section>

    <section class="stats-section">
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="icon">🎁</div>
                <div class="label">Total</div>
                <div class="value" id="total-confirmados">0</div>
            </div>
            <div class="stat-card fisico">
                <div class="icon">📦</div>
                <div class="label">Físicos</div>
                <div class="value" id="total-fisico">0</div>
            </div>
            <div class="stat-card pix">
                <div class="icon">💰</div>
                <div class="label">Via Pix</div>
                <div class="value" id="total-pix">0</div>
            </div>
        </div>
    </section>

    <div class="back-link">
        <a href="index.html">
            <i class="fas fa-arrow-left"></i>
            Voltar para Lista de Presentes
        </a>
    </div>

    <section class="list-section">
        <div id="lista-confirmados">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <p>Carregando presentes confirmados...</p>
            </div>
        </div>
    </section>

    <footer>
        <p>Feito com <span class="heart-footer">♥</span> por Leo & Val</p>
        <p style="margin-top: 5px; font-size: 0.75rem;">31 de Outubro de 2026</p>
    </footer>

    <script>
        function formatarData(data) {
            if (!data) return 'Agora mesmo';
            const d = data.toDate ? data.toDate() : new Date(data);
            return d.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderConfirmados(docs) {
            const lista = document.getElementById('lista-confirmados');
            let fisico = 0;
            let pix = 0;

            if (docs.length === 0) {
                lista.innerHTML = `
                    <div class="empty-state fade-in">
                        <div class="icon">🎁</div>
                        <h3>Nenhum presente ainda</h3>
                        <p>Seja o primeiro a confirmar um presente para Leo & Val!</p>
                    </div>
                `;
                document.getElementById('total-confirmados').textContent = '0';
                document.getElementById('total-fisico').textContent = '0';
                document.getElementById('total-pix').textContent = '0';
                return;
            }

            const ordenados = [...docs].sort((a, b) => {
                const tA = a.data?.toDate ? a.data.toDate().getTime() : 0;
                const tB = b.data?.toDate ? b.data.toDate().getTime() : 0;
                return tB - tA;
            });

            lista.innerHTML = ordenados.map((d, index) => {
                const tipo = d.tipo || 'fisico';
                const isPix = tipo === 'pix';
                if (isPix) pix++;
                else fisico++;

                const icone = isPix ? '💰' : '📦';
                const tagLabel = isPix ? 'Pix' : 'Presente Físico';

                return `
                    <div class="confirmado-card fade-in" style="animation-delay: ${index * 0.05}s">
                        <div class="confirmado-info">
                            <div class="confirmado-icon ${tipo}">${icone}</div>
                            <div class="confirmado-text">
                                <div class="nome">${d.nome || 'Anônimo'}</div>
                                <div class="presente">${d.presente || 'Presente'}</div>
                                ${d.mensagem ? `<div class="confirmado-msg">"${d.mensagem}"</div>` : ''}
                            </div>
                        </div>
                        <div class="confirmado-meta">
                            <span class="confirmado-tag ${tipo}">${tagLabel}</span>
                            <div class="confirmado-data">${formatarData(d.data)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-confirmados').textContent = docs.length;
            document.getElementById('total-fisico').textContent = fisico;
            document.getElementById('total-pix').textContent = pix;
        }

        const q = window.query(window.collection(window.db, 'confirmados'), window.orderBy('data', 'desc'));
        window.onSnapshot(q, (snapshot) => {
            const docs = [];
            snapshot.forEach(doc => docs.push(doc.data()));
            renderConfirmados(docs);
        }, (error) => {
            console.error('Erro:', error);
            document.getElementById('lista-confirmados').innerHTML = `
                <div class="error-state fade-in">
                    <div class="icon" style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
                    <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 8px;">Erro ao carregar</h3>
                    <p>Verifique se o Firestore está configurado corretamente.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
